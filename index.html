<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151d18">
  <meta name="color-scheme" content="dark">
  <title>Drive B — Your Belgian theory companion</title>
  <script>
    const destination = new URL('./dist/', window.location.href);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
  <style>
    :root { color-scheme: dark; color: #edf4e8; background: #151d18; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { padding: 2rem; text-align: center; }
    p { color: #adb9a5; line-height: 1.6; }
    a { color: #c3f658; }
    a:focus-visible { outline: 3px solid #c3f658; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Drive B</h1>
    <p>Your Belgian theory companion is ready.</p>
    <a href="./dist/">Open Drive B</a>
  </main>
</body>
</html>
